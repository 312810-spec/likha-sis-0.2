[package]
name = "app"
version = "0.2.0"
description = "LIKHA-SIS 0.2 - native-first, local-first, offline-capable SIS for Philippine DepEd schools"
authors = ["LIKHA-SIS contributors"]
license = ""
repository = "https://github.com/312810-spec/likha-sis-0.2"
edition = "2021"
rust-version = "1.95"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2"
uuid = { version = "1.20.0", features = ["v7", "serde"] }
rand = "0.10.2"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
password-hash = { version = "0.5.0", features = ["rand_core", "getrandom"] }
calamine = { version = "0.36.1", features = ["dates"] }
tauri-plugin-dialog = "2.7.2"
# Wave 3: official-form (SF1) generation engine. Pure Rust, MIT-licensed,
# actively maintained (v3.1.0, 1M+ total downloads as of 2026-08 -- see
# docs/adr/0048-official-form-engine-sf1.md). Opens an EXISTING .xlsx
# template and patches specific cells while leaving the rest of the
# workbook object model (merges, formulas, styles, other sheets) intact
# -- exactly the "template-copy + constrained cell patching" shape this
# project needs, with zero new runtime/process/IPC surface. `.xlsx`/`.xlsm`
# only, no legacy `.xls` (BIFF) support -- accepted per ADR-0048's
# evidence that DepEd's current School Form distribution format is
# `.xlsx` (a real in-use `CONSO SF v2025.xlsx` workbook, inspected during
# M8).
umya-spreadsheet = "3"
# Already resolved in this workspace's dependency tree (pulled transitively
# by tauri-codegen at build time) -- promoting it to a direct runtime
# dependency adds no new crate to compile, just links the same version into
# the app binary too. Used only for a stable, version-independent content
# fingerprint (import::fingerprint) -- NOT a security/integrity control, see
# that module's doc comment. `std`'s `DefaultHasher` was considered and
# rejected: its docs explicitly disclaim algorithm stability across Rust
# releases, which would silently break a fingerprint persisted in SQLite
# after a toolchain upgrade.
sha2 = "0.11"
tauri-plugin-opener = "2.5.5"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
hkdf = "0.13.0"
# ADR-0067 network listener (school-laptop sync hub). tokio-rs org,
# MIT-licensed, actively maintained (last published 2026-04). Chosen over
# warp (also actively maintained, also tokio-based, but its Filter
# combinator API is less ergonomic for this team than axum's plain
# extractor/handler functions) and over tiny_http (last published
# 2022-10 -- effectively dormant, and would need this project to hand-roll
# JSON/routing/auth-extraction support it provides for free). Reuses the
# tokio runtime Tauri already depends on internally (`tauri::async_runtime::spawn`
# is the documented pattern for running an axum server inside a Tauri app,
# not a second/parallel runtime). `default-features = false` keeps only
# what a small, LAN-only, JSON push/pull API needs: `json` (request/response
# bodies), `http1` (no HTTP/2 needed on a LAN), `tokio` (the server driver).
# See `docs/adr/0067-school-laptop-authoritative-sync-hub.md`'s network-
# listener addendum for the full decision record.
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio", "query"] }
# Already resolved transitively (Tauri itself depends on tokio; axum's
# `tokio` feature above needs it too) -- promoted to a direct dependency
# because `hub_server`'s own production code calls `tokio::net::TcpListener`
# directly, which Rust requires a direct `Cargo.toml` edge for, not just a
# transitive one. `net` (`TcpListener`) + `rt` (the runtime `axum::serve`
# drives) only -- this app still runs on Tauri's own tokio runtime via
# `tauri::async_runtime::spawn`, never a second `#[tokio::main]` runtime.
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt"] }
# ADR-0067 client-side sync loop: the small blocking HTTP client that
# drains sync_outbox to POST /sync/push and GETs /sync/pull against the
# loopback-only hub_server above. `reqwest` was already present
# transitively in this workspace's lockfile (pulled in by an optional
# tauri feature for its wasm32 target only -- confirmed via
# `cargo tree -i reqwest`, which prints nothing for our actual native
# target) so it was not, in fact, already usable; this promotes it to a
# real direct dependency. `default-features = false` with only
# `blocking` (a plain synchronous client -- this loop runs on its own
# background OS thread, not inside Tauri's tokio runtime, so no async
# plumbing is needed), `json` (typed request/response bodies matching
# hub_server's own `axum::Json` extractors), and `query` (typed
# `?after=&limit=` query strings for `GET /sync/pull`, matching axum's
# own `query` feature it already enables for the `Query` extractor).
# Deliberately NO tls feature:
# every request targets `127.0.0.1` in plain HTTP, matching this ADR's
# own "loopback only, plaintext HTTP inside the trust boundary" decision
# for `hub_server` -- a TLS backend would be dead weight and a bigger
# dependency surface for a URL that can never be `https://`.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query"] }

# Windows-only: the DPAPI key store (src/crypto/dpapi.rs) binds Win32 COM
# APIs that only exist on Windows. Tauri's own Windows-only webview backend
# deps (tao/wry/webview2-com) are already target-gated the same way — this
# was previously declared unconditionally, forcing windows-future's
# Windows-only async/COM-marshaling code to compile even on non-Windows
# hosts, where it cannot succeed (see ADR-0040).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
