[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.95"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2"
uuid = { version = "1.20.0", features = ["v7"] }
rand = "0.10.2"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
password-hash = { version = "0.5.0", features = ["rand_core", "getrandom"] }
calamine = { version = "0.36.1", features = ["dates"] }
tauri-plugin-dialog = "2.7.2"
# Wave 3: official-form (SF1) generation engine. Pure Rust, MIT-licensed,
# actively maintained (v3.1.0, 1M+ total downloads as of 2026-08 -- see
# docs/adr/0048-official-form-engine-sf1.md). Opens an EXISTING .xlsx
# template and patches specific cells while leaving the rest of the
# workbook object model (merges, formulas, styles, other sheets) intact
# -- exactly the "template-copy + constrained cell patching" shape this
# project needs, with zero new runtime/process/IPC surface. `.xlsx`/`.xlsm`
# only, no legacy `.xls` (BIFF) support -- accepted per ADR-0048's
# evidence that DepEd's current School Form distribution format is
# `.xlsx` (a real in-use `CONSO SF v2025.xlsx` workbook, inspected during
# M8).
umya-spreadsheet = "3"
# Already resolved in this workspace's dependency tree (pulled transitively
# by tauri-codegen at build time) -- promoting it to a direct runtime
# dependency adds no new crate to compile, just links the same version into
# the app binary too. Used only for a stable, version-independent content
# fingerprint (import::fingerprint) -- NOT a security/integrity control, see
# that module's doc comment. `std`'s `DefaultHasher` was considered and
# rejected: its docs explicitly disclaim algorithm stability across Rust
# releases, which would silently break a fingerprint persisted in SQLite
# after a toolchain upgrade.
sha2 = "0.10"
tauri-plugin-opener = "2.5.5"

# Windows-only: the DPAPI key store (src/crypto/dpapi.rs) binds Win32 COM
# APIs that only exist on Windows. Tauri's own Windows-only webview backend
# deps (tao/wry/webview2-com) are already target-gated the same way — this
# was previously declared unconditionally, forcing windows-future's
# Windows-only async/COM-marshaling code to compile even on non-Windows
# hosts, where it cannot succeed (see ADR-0040).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"
