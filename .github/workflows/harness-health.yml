name: Harness Contract Health

on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-health:
    name: Harness contract and staleness check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify current harness contract
        run: node scripts/harness/verify.mjs
