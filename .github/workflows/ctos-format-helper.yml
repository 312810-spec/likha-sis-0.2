name: CTOS format helper

on:
  push:
    branches:
      - ctos/integration-v3
    paths:
      - CTOS-STATE.md
      - docs/ctos/**
      - docs/research/deped-mandaue-2026-source-note.md
      - .github/workflows/ctos-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ctos/integration-v3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format CTOS markdown
        run: |
          npx prettier --write             CTOS-STATE.md             docs/SOURCE-REGISTRY.md             docs/ctos/PR103-SALVAGE-MAP.md             docs/ctos/checkpoints/M00.md             docs/ctos/evals/*.md             docs/research/deped-mandaue-2026-source-note.md

      - name: Remove one-shot helper
        run: rm .github/workflows/ctos-format-helper.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CTOS-STATE.md docs .github/workflows/ctos-format-helper.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ctos(m00): format integration documentation"
          git push origin HEAD:ctos/integration-v3
