name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Quality / classify affected work
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      harness: ${{ steps.classify.outputs.harness }}
      javascript: ${{ steps.classify.outputs.javascript }}
      ui: ${{ steps.classify.outputs.ui }}
      native: ${{ steps.classify.outputs.native }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - name: Checkout full history for diff classification
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/likha-changed-files.txt"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_file"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$changed_file"
            else
              git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA" > "$changed_file"
            fi
          else
            : > "$changed_file"
          fi

          echo "Changed files:"
          cat "$changed_file"

      - name: Verify classifier behavior
        run: node --test scripts/ci/classify-changes.test.mjs

      - name: Classify affected work
        id: classify
        shell: bash
        env:
          FORCE_FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/classify-changes.mjs < "$RUNNER_TEMP/likha-changed-files.txt"

  quality-ubuntu:
    name: Quality (Ubuntu)
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: needs.classify.outputs.docs_only == 'true' || needs.classify.outputs.harness == 'true' || needs.classify.outputs.javascript == 'true' || needs.classify.outputs.ui == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: needs.classify.outputs.docs_only == 'true' || needs.classify.outputs.harness == 'true' || needs.classify.outputs.javascript == 'true' || needs.classify.outputs.ui == 'true'
        run: npm ci

      - name: Show canonical verifier formatting
        if: needs.classify.outputs.harness == 'true'
        shell: bash
        run: |
          npx prettier --write scripts/harness/verify.mjs
          git diff -- scripts/harness/verify.mjs
          git checkout -- scripts/harness/verify.mjs

      - name: Run documentation formatting gate
        if: needs.classify.outputs.docs_only == 'true'
        run: npm run format:check

      - name: Verify harness contract
        if: needs.classify.outputs.harness == 'true'
        run: npm run harness:verify

      - name: Run JavaScript and TypeScript quality gate
        if: needs.classify.outputs.javascript == 'true'
        run: npm run quality

      - name: Install Chromium for deterministic UI verification
        if: needs.classify.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run UI workflow and accessibility smoke gate
        if: needs.classify.outputs.ui == 'true'
        run: npm run quality:ui

      - name: Install Tauri Linux build dependencies
        if: needs.classify.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Confirm Rust toolchain is present
        if: needs.classify.outputs.native == 'true'
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Run native Rust quality gate
        if: needs.classify.outputs.native == 'true'
        run: cd src-tauri && cargo fmt --check && cargo test && cargo clippy --all-targets -- -D warnings

  quality-windows:
    name: Quality (Windows)
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Confirm Rust toolchain is present
        run: |
          rustc --version
          cargo --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build the Windows-native Tauri application
        run: npm run tauri build -- --debug
