name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: likha-claude-wave
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == '312810-spec' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow the owner-gated automation to dispatch and inspect required CI workflows
          additional_permissions: |
            actions: write

          # Owner-authorized autonomous delivery: verify locally, commit and push only
          # the action-managed branch, open a PR, inspect/dispatch CI, and merge only
          # after the exact checkpoint's required Quality and Security gates are green.
          claude_args: |
            --allowedTools "Edit,Read,Write,Bash(npm:*),Bash(npx:*),Bash(cargo:*),Bash(rg:*),Bash(git status:*),Bash(git diff:*),Bash(git rev-parse:*),Bash(git log:*),Bash(git show:*),Bash(git branch --show-current),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git diff-tree:*),Bash(git grep:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git restore package-lock.json),Bash(gh run:*),Bash(gh workflow run:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(gh issue comment:*)"
